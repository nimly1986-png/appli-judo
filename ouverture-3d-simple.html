<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe3ff">
<title>JCO Chandieu</title>
<style>
  /* =================================================================
     OUVERTURE « 3D » : proposition (n'est pas encore branchée à l'appli)
     Le logo est découpé en couches (soleil, judokas, kanji, nom du club) placées à des
     profondeurs différentes. Elles arrivent de loin, s'assemblent, puis le tout suit le doigt
     (ou l'inclinaison du téléphone). Un toucher fait traverser le logo pour entrer.
     Aucune bibliothèque externe : tout est en CSS et JavaScript simples.
     ================================================================= */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(to bottom, #9fd2ff, #e6f3ff 55%, #fff1d9);
    touch-action: none;
  }
  .stage { position: fixed; inset: 0; perspective: 900px; perspective-origin: 50% 42%; display: grid; place-items: center; }

  /* le tatami, vu en perspective */
  .sol {
    position: absolute; left: -60%; right: -60%; bottom: -6%; height: 52%;
    transform-origin: 50% 100%; transform: rotateX(68deg);
    background:
      linear-gradient(90deg, rgba(60, 80, 30, 0.35) 0 2px, transparent 2px) 0 0 / 14% 100%,
      linear-gradient(0deg, rgba(60, 80, 30, 0.35) 0 2px, transparent 2px) 0 0 / 100% 22%,
      #cddc9d;
    -webkit-mask-image: linear-gradient(to top, #000 55%, transparent);
            mask-image: linear-gradient(to top, #000 55%, transparent);
    animation: sol-arrive 1.4s ease-out both;
  }
  .ombre {
    position: absolute; left: 50%; top: 77%; width: min(60vw, 40vh); height: 5vh; margin-left: calc(min(60vw, 40vh) / -2);
    border-radius: 50%; background: radial-gradient(closest-side, rgba(40, 30, 10, 0.35), transparent);
    animation: ombre-arrive 2.2s 0.4s both;
  }

  .monde { position: relative; width: min(88vw, 56vh); aspect-ratio: 1; transform-style: preserve-3d;
           transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--zoom, 1)); will-change: transform; }
  .monde > * { position: absolute; inset: 0; transform-style: preserve-3d; }
  .couche { animation: assemble 1.5s cubic-bezier(0.2, 0.9, 0.25, 1) both; animation-delay: var(--d); }
  .couche img, .couche .disque-rond { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1.4vmin 1.6vmin rgba(20, 20, 40, 0.35)); }

  .disque-rond { position: absolute; left: 3%; top: 3.9%; width: 94%; height: 94%; border-radius: 50%; border: 0.9vmin solid #14141c; background: #e41e24; overflow: hidden; }
  .disque-rond .lignes { position: absolute; left: 50%; top: 50%; width: 230%; height: 230%; margin: -115% 0 0 -115%; animation: tourne 60s linear infinite; filter: none; }
  .trame { position: absolute; inset: 0; background: radial-gradient(circle, #96101a 32%, transparent 36%) 0 0 / 2.2% 2.2%;
           -webkit-mask-image: linear-gradient(to bottom, transparent 55%, #000); mask-image: linear-gradient(to bottom, transparent 55%, #000); }
  /* les profondeurs : plus le chiffre est grand, plus la couche est près de nous */
  .c-disque { --z: -40px; --d: 0s; }
  .c-judokas { --z: 50px; --d: 0.25s; }
  .c-kanji { --z: 90px; --d: 0.5s; }
  .c-texte { --z: 140px; --d: 0.75s; }
  .c-etoiles { --z: 170px; --d: 1.1s; }
  .etoile { position: absolute; width: 7%; height: 7%; animation: etincelle 1.8s ease-in-out infinite; opacity: 0; }
  .etoile svg { width: 100%; height: 100%; overflow: visible; }
  .e1 { left: 77%; top: 26%; width: 9%; height: 9%; animation-delay: 2.2s; }
  .e2 { left: 12%; top: 58%; animation-delay: 2.7s; }
  .e3 { left: 70%; top: 72%; width: 5%; height: 5%; animation-delay: 3.2s; }

  .invite { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; z-index: 5;
            font: 700 16px "Trebuchet MS", system-ui, sans-serif; color: #16284a; opacity: 0; animation: apparait 0.6s 3s both; }
  .voile { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; transition: opacity 0.45s ease-in; }
  .entre .voile { opacity: 1; }

  @keyframes assemble { from { opacity: 0; transform: translateZ(-900px) rotateY(70deg) scale(0.4); }
                        50% { opacity: 1; }
                        to { opacity: 1; transform: translateZ(var(--z)); } }
  @keyframes sol-arrive { from { opacity: 0; transform: rotateX(68deg) translateY(30%); } to { opacity: 1; transform: rotateX(68deg); } }
  @keyframes ombre-arrive { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: none; } }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @keyframes etincelle { 0%,100% { opacity: 0; transform: scale(0.2) rotate(0); } 40%,60% { opacity: 1; transform: scale(1) rotate(25deg); } }
  @keyframes apparait { to { opacity: 0.85; } }
  @media (prefers-reduced-motion: reduce) {
    .couche, .sol, .ombre { animation: none; opacity: 1; transform: translateZ(var(--z)); }
    .sol { transform: rotateX(68deg); } .ombre { transform: none; }
    .disque-rond .lignes, .etoile { animation: none; } .etoile { opacity: 1; }
    .invite { animation: none; opacity: 0.85; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="sol"></div>
    <div class="ombre"></div>
    <div class="monde" id="monde" aria-label="Logo du club JCO Chandieu">
      <div class="couche c-disque"><div class="disque-rond"><img class="lignes" src="img/manga/lignes.png" alt=""><div class="trame"></div></div></div>
      <div class="couche c-judokas"><img src="img/manga/judokas.png" alt=""></div>
      <div class="couche c-kanji"><img src="img/manga/kanji.png" alt=""></div>
      <div class="couche c-texte"><img src="img/manga/texte.png" alt="JCO Chandieu"></div>
      <div class="couche c-etoiles">
        <div class="etoile e1"><svg viewBox="-50 -50 100 100"><polygon points="0,-50 11,-11 50,0 11,11 0,50 -11,11 -50,0 -11,-11" fill="#fff" stroke="#14141c" stroke-width="5"/></svg></div>
        <div class="etoile e2"><svg viewBox="-50 -50 100 100"><polygon points="0,-50 11,-11 50,0 11,11 0,50 -11,11 -50,0 -11,-11" fill="#fff" stroke="#14141c" stroke-width="5"/></svg></div>
        <div class="etoile e3"><svg viewBox="-50 -50 100 100"><polygon points="0,-50 11,-11 50,0 11,11 0,50 -11,11 -50,0 -11,-11" fill="#fff" stroke="#14141c" stroke-width="5"/></svg></div>
      </div>
    </div>
  </div>
  <div class="voile"></div>
  <p class="invite">Touchez pour entrer</p>

  <script>
    const PAGE_SUIVANTE = "accueil.html";
    const monde = document.getElementById("monde");
    const calme = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const figer = new URLSearchParams(location.search).get("t");   // ?t=3 : image figée, pour les tests

    // Inclinaison cible (en degrés) : le doigt, la souris ou le téléphone la modifient.
    let cibleX = 0, cibleY = 0, x = 0, y = 0, dernierGeste = -9999, entre = false, zoom = 1;
    function pointeur(e) {
      const p = e.touches ? e.touches[0] : e;
      cibleY = ((p.clientX / innerWidth) - 0.5) * 36;
      cibleX = -((p.clientY / innerHeight) - 0.5) * 24;
      dernierGeste = performance.now();
    }
    addEventListener("pointermove", pointeur);
    addEventListener("touchmove", pointeur, { passive: true });
    addEventListener("deviceorientation", function (e) {
      if (e.gamma == null) { return; }
      cibleY = Math.max(-20, Math.min(20, e.gamma)) * 0.9;
      cibleX = Math.max(-15, Math.min(15, (e.beta || 0) - 45)) * -0.7;
      dernierGeste = performance.now();
    });

    function boucle(t) {
      if (!entre && t - dernierGeste > 1800) {      // sans geste : léger balancement tout seul
        cibleY = Math.sin(t / 1400) * 14;
        cibleX = Math.cos(t / 1900) * 6;
      }
      x += (cibleX - x) * 0.08;
      y += (cibleY - y) * 0.08;
      if (entre) { zoom += (3.2 - zoom) * 0.1; }
      monde.style.setProperty("--rx", x.toFixed(2) + "deg");
      monde.style.setProperty("--ry", y.toFixed(2) + "deg");
      monde.style.setProperty("--zoom", zoom.toFixed(3));
      requestAnimationFrame(boucle);
    }
    if (!calme && figer === null) { requestAnimationFrame(boucle); }

    function entrer() {
      if (entre) { return; }
      entre = true;
      document.body.classList.add("entre");
      setTimeout(function () { location.href = PAGE_SUIVANTE; }, calme ? 50 : 500);
    }
    addEventListener("click", entrer);
    addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { entrer(); } });
    if (figer !== null) {
      document.querySelectorAll(".couche, .sol, .ombre, .invite").forEach(function (e) { e.style.animationDelay = "-" + figer + "s"; });
    }
  </script>
</body>
</html>
