<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace administrateur</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="categorie.js"></script>
</head>
<body style="--accent: var(--violet)">
  <nav class="barre"><div class="barre-contenu"><a class="barre-accueil" href="admin.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Espace admin</a></div></nav>
  <h1>🔧 Inscription judoka</h1>
  <p class="avertissement">
    Version d'essai : utilisez uniquement de fausses données.
    Cette page n'est pas encore protégée par un mot de passe.
  </p>

  <div id="alertes"></div>

  <h2 id="titre-formulaire">Nouvelle fiche</h2>
  <div class="formulaire">
    <input id="prenom" placeholder="Prénom" autocomplete="off">
    <input id="nom" placeholder="Nom" autocomplete="off">
    <label>Date de naissance
      <input id="naissance" type="date" min="1920-01-01">
    </label>
    <label>Ceinture
      <select id="ceinture"></select>
    </label>
    <label>Numéro de licence
      <input id="licence" inputmode="numeric" autocomplete="off" placeholder="Numéro de licence fédérale">
    </label>
    <label>Au club depuis (année d'inscription)
      <input id="entree" type="number" inputmode="numeric" min="1960" max="2100" step="1" placeholder="ex : 2019">
    </label>
    <label>Poids (kg)
      <input id="poids" type="number" min="0" max="200" step="0.1" inputmode="decimal">
    </label>
    <label>Photo (facultative)
      <input id="photo" type="file" accept="image/*">
    </label>
    <button id="retirer-photo" class="bouton secondaire" type="button" hidden>Retirer la photo</button>
    <label>E-mail du responsable légal
      <input id="email" type="email" inputmode="email" autocomplete="off" placeholder="prenom.nom@exemple.fr">
    </label>
    <label>Téléphone du responsable légal
      <input id="telephone" type="tel" inputmode="tel" autocomplete="off" placeholder="06 00 00 00 00">
    </label>
    <label>Responsable légal / autres contacts
      <textarea id="contacts" rows="2" placeholder="Nom du responsable, autres personnes à joindre"></textarea>
    </label>

    <fieldset class="bloc-dossier">
      <legend>Dossier</legend>
      <label class="case"><input type="checkbox" id="certificat"> Certificat médical / attestation reçu</label>
    </fieldset>

    <fieldset class="bloc-dossier">
      <legend>Règlement</legend>
      <label class="case"><input type="checkbox" id="reglement-recu"> Règlement reçu</label>
      <div class="modes" id="modes">
        <label class="case"><input type="checkbox" value="cheques"> Chèques</label>
        <label class="case"><input type="checkbox" value="virement"> Virement</label>
        <label class="case"><input type="checkbox" value="especes"> Espèces</label>
        <label class="case"><input type="checkbox" value="passsport"> Pass'Sport Région</label>
      </div>
      <div id="paiements"></div>
      <div id="bloc-cheques" hidden>
        <label>Nombre de chèques
          <input id="nb-cheques" type="number" min="1" max="12" step="1" inputmode="numeric">
        </label>
        <div id="liste-cheques"></div>
      </div>
      <div id="alerte-reglement" class="alerte-reglement" hidden>
        <strong>⚠ Règlement non reçu</strong>
        <label>Relancer le
          <input id="relance" type="date">
        </label>
        <div class="actions-relance">
          <button id="relance-agenda" class="bouton secondaire" type="button">Ajouter la relance à mon agenda</button>
          <a id="relance-mail" class="bouton secondaire" hidden>Écrire un rappel</a>
          <a id="relance-tel" class="bouton secondaire" hidden>Appeler</a>
        </div>
      </div>
    </fieldset>
    <button id="enregistrer" class="bouton" type="button">Enregistrer la fiche</button>
    <button id="annuler" class="bouton secondaire" type="button" hidden>Annuler la modification</button>
  </div>

  <h2>Aperçu de la fiche</h2>
  <div id="apercu"></div>

  <h2>Fiches enregistrées</h2>
  <div class="tableau-conteneur">
    <table id="tableau"></table>
  </div>

  <a class="bouton secondaire" href="admin.html">⬅ Espace administrateur</a>

  <script src="judo-commun.js"></script>
  <script src="competitions-data.js"></script>
  <script src="competitions-commun.js"></script>
  <script src="admin-fiches.js"></script>
</body>
</html>
